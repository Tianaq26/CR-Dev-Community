# Render Blueprint: creates the API as a Docker web service on the free plan.
# The database is NOT created here on purpose: Render's free Postgres expires after 30 days.
# Use a free Neon database instead (see docs/DESPLIEGUE.md) and paste its URL as DATABASE_URL.
services:
  - type: web
    name: crdev-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO
        value: "true"
